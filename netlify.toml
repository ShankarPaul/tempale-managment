[build]
  command = "npm install && node -e \"const fs=require('fs'); fs.cpSync('views', 'netlify/views', {recursive:true}); fs.cpSync('views', 'netlify/functions/views', {recursive:true});\""
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["views/**", "netlify/views/**", "netlify/functions/views/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
